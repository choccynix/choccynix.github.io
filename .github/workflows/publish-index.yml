# ◈ publish-index.yml
#
# Manual escape hatch: re-sign and re-publish the existing gh-pages Packages
# index without rebuilding every package — useful if a signing key rotates,
# or the index needs a manual correction. Runs on plain ubuntu-latest (no
# musl container needed, since it's only touching text + gpg), so
# actions/checkout is fine here.

name: Re-publish Packages index

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is this being re-run manually?"
        required: true
        default: "key rotation"

permissions:
  contents: write

jobs:
  resign-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current gh-pages Packages
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

      - name: Re-sign
        env:
          GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          python3 scripts/sign-packages.py gh-pages/Packages gh-pages/Packages.sig

      - name: Push
        run: |
          cd gh-pages
          git config user.name "athanor-ci"
          git config user.email "ci@athanoros.invalid"
          touch .nojekyll
          git add Packages.sig .nojekyll
          git commit -m "Re-sign Packages index (${{ github.event.inputs.reason }})" || echo "nothing to commit"
          git push origin gh-pages
