name: Update Gentoo Binhost

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - 'update_repo.py'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  update-binhost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Run update script inside Gentoo container
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace gentoo/stage3 python3 update_repo.py

      - name: Commit and push changes
        run: |
          sudo chown -R $USER:$USER .
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update Gentoo binhost index [skip ci]" || echo "No changes to commit."
          git push origin gh-pages
