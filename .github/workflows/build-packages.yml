# ◈ build-packages.yml
#
# Builds seven package groups in parallel — core, graphics, desktop,
# browser, kde-qt, xorg, xlibre — each in its own gentoo/stage3:musl-llvm
# container job. This split exists because GitHub-hosted runners hard-cap
# every job at 6 hours regardless of plan — the browser group was isolated
# after firefox (since replaced with webkit-gtk/surf) hit that ceiling on
# its own. Each group gets its own ccache, persisted as a release asset
# between runs, so repeat builds only recompile what changed.
#
# xorg and xlibre are alternatives to each other, not additions — see
# packages.xlibre.list for why they can't be installed on the same system
# (file collisions), and why both still get built and published anyway
# (the choice of which to install is left to whoever consumes the binhost).
#
# `git` is NOT present in gentoo/stage3:musl-llvm, so source is fetched as a
# tarball via the GitHub API (urllib) instead of `git clone` — same root
# cause as the Node/musl incompatibility already solved for the ISO
# pipeline: don't assume tooling beyond what the container actually ships.
#
# A final non-container job merges each group's Packages-index fragment,
# signs the result, and publishes to gh-pages. That job runs on plain
# ubuntu-latest (no musl container), so actions/checkout and git are fine
# there — the container-only restrictions don't apply to it.

name: Build binary packages

on:
  push:
    branches: [gh-pages]
    paths:
      - "packages*.list"
      - "scripts/**"
      - ".github/workflows/build-packages.yml"
  pull_request:
    paths:
      - "packages*.list"
      - "scripts/**"
      - ".github/workflows/build-packages.yml"
  schedule:
    - cron: "0 3 * * *"  #Everyday at 3
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # hard ceiling on GitHub-hosted runners — cannot go higher
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            list: packages.list
          - group: graphics
            list: packages.graphics.list
          - group: desktop
            list: packages.desktop.list
          - group: browser
            list: packages.browser.list
          - group: kde-qt
            list: packages.kde-qt.list
          - group: xorg
            list: packages.xorg.list
          - group: xlibre
            list: packages.xlibre.list
    container:
      image: gentoo/stage3:musl-llvm
      options: --privileged
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CCACHE_DIR: /var/cache/ccache
    steps:
      - name: Fetch repo tarball (git is not present in this container)
        run: |
          python3 -c "import os,urllib.request as u; t=os.environ['GITHUB_TOKEN']; r=os.environ['GITHUB_REPOSITORY']; s=os.environ['GITHUB_SHA']; req=u.Request('https://api.github.com/repos/%s/tarball/%s' % (r, s), headers={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'}); open('/tmp/src.tar.gz','wb').write(u.urlopen(req).read())"
          mkdir -p src
          tar -xzf /tmp/src.tar.gz -C src --strip-components=1

      - name: Sync portage tree
        run: emerge-webrsync

      - name: Add XLibre overlay (xlibre group only)
        if: matrix.group == 'xlibre'
        run: |
          # XLibre is not in the main Gentoo tree — checked, confirmed via
          # the Gentoo wiki and the overlay's own repo. Fetched as a tarball
          # (git isn't present in this container, same as the repo fetch
          # step above) rather than assuming it's registered for
          # `eselect repository enable`.
          python3 -c "import urllib.request as u; open('/tmp/xlibre.tar.gz','wb').write(u.urlopen('https://api.github.com/repos/X11Libre/ports-gentoo/tarball').read())"
          mkdir -p /var/db/repos/xlibre
          tar -xzf /tmp/xlibre.tar.gz -C /var/db/repos/xlibre --strip-components=1
          mkdir -p /etc/portage/repos.conf
          printf '[xlibre]\nlocation = /var/db/repos/xlibre\n' > /etc/portage/repos.conf/xlibre.conf

          # Best-effort: the overlay's own driver meta-package still
          # depends on packages deeper in its tree that our initial
          # 2-atom keyword list didn't cover (e.g. x11-drivers/xf86-input-
          # libinput::xlibre came back masked by ~amd64/missing keyword on
          # a real run) — widening to the whole ::xlibre repo rather than
          # chasing each transitive atom individually.
          mkdir -p /etc/portage/package.accept_keywords
          echo "*/* ~amd64" > /etc/portage/package.accept_keywords/xlibre-overlay

          # Confirmed on a real run: x11-base/xlibre-drivers' own
          # dependency chain still pulls in mainline x11-base/xorg-server
          # (the overlay's own dependency graph isn't fully xlibre-aware
          # yet — a real immaturity gap in a young overlay, not a mistake
          # in this list), causing exactly the file collision XLibre's docs
          # warn about. Masking the ::gentoo copy specifically (not
          # ::xlibre's own package of the same name) for this group only,
          # so resolution is forced toward whatever the overlay actually
          # intends instead of colliding with it.
          mkdir -p /etc/portage/package.mask
          echo "x11-base/xorg-server::gentoo" > /etc/portage/package.mask/xlibre-overlay

      - name: Restore ccache
        run: |
          emerge --oneshot --quiet dev-util/ccache || true
          python3 src/scripts/sync-ccache.py pull "${{ matrix.group }}" "$CCACHE_DIR"
          echo 'FEATURES="${FEATURES} ccache"' >> /etc/portage/make.conf

      - name: Best-effort testing-keyword acceptance (kde-qt group only)
        if: matrix.group == 'kde-qt'
        run: |
          # gentoo/musl/llvm is an experimental profile — several of these
          # atoms may only exist keyworded ~amd64 (testing), not stable amd64.
          # Scoped to this group's atoms only, not a blanket ACCEPT_KEYWORDS
          # bump, since that risks destabilizing unrelated packages.
          mkdir -p /etc/portage/package.accept_keywords
          {
            echo "dev-qt/qtbase ~amd64"
            echo "dev-qt/qtsvg ~amd64"
            echo "dev-qt/qtdeclarative ~amd64"
            echo "dev-qt/qtwayland ~amd64"
            echo "dev-qt/qttranslations ~amd64"
            echo "kde-frameworks/* ~amd64"
            echo "sys-libs/kpmcore ~amd64"
          } > /etc/portage/package.accept_keywords/athanor-ci

      - name: Diagnose unresolvable atoms (informational, does not fail the job)
        working-directory: src
        run: python3 scripts/diagnose-masks.py "${{ matrix.list }}" || true

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=binpkgs-artifacts-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=binpkgs-rolling-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        working-directory: src
        run: |
          mkdir -p /var/cache/binpkgs
          python3 scripts/build-binpkg.py "${{ matrix.list }}" /var/cache/binpkgs

      - name: Upload build report (always, even on failure — this is how you get the detail)
        if: always()
        working-directory: src
        run: |
          if [ -f /var/cache/binpkgs/build-report.json ]; then
            python3 scripts/upload-single-asset.py \
              /var/cache/binpkgs/build-report.json \
              "${{ steps.tag.outputs.tag }}" \
              "build-report-${{ matrix.group }}.json"
          fi

      - name: Save ccache
        if: always()
        run: python3 src/scripts/sync-ccache.py push "${{ matrix.group }}" "$CCACHE_DIR"

      - name: Upload packages to release
        working-directory: src
        run: |
          python3 scripts/upload-release.py \
            /var/cache/binpkgs \
            "${{ steps.tag.outputs.tag }}" \
            /var/cache/binpkgs/upload-map.json

      - name: Rewrite this group's Packages fragment with release URIs
        working-directory: src
        run: |
          python3 scripts/generate-packages-index.py \
            /var/cache/binpkgs/Packages \
            /var/cache/binpkgs/upload-map.json \
            /var/cache/binpkgs/Packages.final

      - name: Publish fragment for the merge job to pick up
        working-directory: src
        run: |
          python3 scripts/upload-single-asset.py \
            /var/cache/binpkgs/Packages.final \
            "${{ steps.tag.outputs.tag }}" \
            "Packages.${{ matrix.group }}"

  merge-and-publish:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: echo "tag=binpkgs-rolling-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download each group's Packages fragment
        run: |
          mkdir -p fragments
          for group in core graphics desktop browser kde-qt xorg xlibre; do
            gh release download "${{ steps.tag.outputs.tag }}" \
              --pattern "Packages.$group" --dir fragments --clobber || \
              echo "[warn] fragment missing for $group"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge fragments
        run: |
          python3 scripts/merge-packages-index.py \
            Packages.final \
            fragments/Packages.core fragments/Packages.graphics fragments/Packages.desktop fragments/Packages.browser fragments/Packages.kde-qt fragments/Packages.xorg fragments/Packages.xlibre

      - name: Sign merged index
        run: python3 scripts/sign-packages.py Packages.final Packages.sig

      - name: Publish to gh-pages
        run: |
          git config --global user.name "athanor-ci"
          git config --global user.email "ci@athanoros.invalid"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages || {
              mkdir gh-pages && cd gh-pages && git init && \
              git checkout -b gh-pages && cd ..
            }
          cp Packages.final gh-pages/Packages
          cp Packages.sig gh-pages/Packages.sig
          touch gh-pages/.nojekyll
          cat > gh-pages/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>AthanorOS Binhost</title></head>
          <body><h1>AthanorOS Binary Package Repository</h1>
          <p>Portage metadata: <a href="Packages">Packages</a></p></body></html>
          EOF
          cd gh-pages
          git add Packages Packages.sig .nojekyll index.html
          git commit -m "Update Packages index (${{ steps.tag.outputs.tag }})" || echo "nothing to commit"
          git push origin gh-pages
